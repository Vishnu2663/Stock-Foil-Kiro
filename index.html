<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1712" />
    <meta name="description" content="Stock & Foil: the split tally stick, back from the dead. A tamper-proof paper work record for daily cash workers. Free, offline, no account." />
    <title>Stock &amp; Foil</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      #sf-splash { position: fixed; inset: 0; z-index: 1000; background-color: #1c1814; display: grid; place-items: center; transition: background-color .7s ease; --ms: 1500ms; }
      #sf-splash .stage { display: grid; justify-items: center; gap: 0; }
      #sf-splash.flying { background-color: rgba(28, 24, 20, 0); pointer-events: none; }
      #sf-splash .brand { display: inline-flex; align-items: center; gap: 30px; text-decoration: none; transform-origin: 0 0; backface-visibility: hidden; }
      #sf-splash .logo { width: 105px; height: 105px; display: block; border-radius: 26px; box-shadow: 0 0 40px rgba(226, 110, 60, .5), 0 0 8px rgba(226, 88, 74, .6); animation: sfGlow 1.6s ease-in-out infinite alternate; }
      #sf-splash .word { display: grid; line-height: 1; font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Noto Serif', Georgia, serif; font-weight: 700; letter-spacing: .14em; font-size: 42px; animation: sfIn .7s ease-out both; }
      #sf-splash .word .s { color: #f1e7d0; }
      #sf-splash .word .f { color: #e2584a; }
      #sf-splash .word svg { width: 252px; height: 14px; display: block; margin: 3px 0 6px; }
      #sf-splash .tag { margin-top: 38px; font: 700 13px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: .32em; color: #a59a87; animation: sfIn .7s .25s ease-out both; transition: opacity .3s; }
      #sf-splash .bar { margin-top: 24px; width: 250px; height: 2px; border-radius: 2px; background: rgba(241, 231, 208, .12); overflow: hidden; transition: opacity .3s; }
      #sf-splash .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #e2584a, #f0a85a); transform-origin: 0 50%; animation: sfBar var(--ms) cubic-bezier(.4, 0, .2, 1) both; }
      #sf-splash.flying .tag, #sf-splash.flying .bar { opacity: 0; }
      #sf-splash.flying .logo { animation: none; }
      @keyframes sfIn { from { opacity: .35; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes sfBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes sfGlow { from { box-shadow: 0 0 26px rgba(226, 110, 60, .35), 0 0 6px rgba(226, 88, 74, .5); } to { box-shadow: 0 0 52px rgba(240, 130, 60, .6), 0 0 10px rgba(226, 88, 74, .7); } }
      @media (max-width: 520px) {
        #sf-splash .brand { gap: 18px; }
        #sf-splash .logo { width: 72px; height: 72px; border-radius: 18px; }
        #sf-splash .word { font-size: 29px; }
        #sf-splash .word svg { width: 174px; height: 10px; }
        #sf-splash .tag { font-size: 11px; letter-spacing: .24em; margin-top: 28px; }
        #sf-splash .bar { width: 200px; }
      }
      @media (prefers-reduced-motion: reduce) { #sf-splash * { animation: none !important; } }
    </style>
  </head>
  <body class="splashing">
    <div id="sf-splash" aria-hidden="true">
      <div class="stage">
        <span class="brand">
          <svg class="logo" viewBox="0 0 96 96"><rect width="96" height="96" rx="22" fill="#7a1f1f"/><rect x="14" y="24" width="68" height="50" rx="1.5" fill="#e3d1a4"/><path d="M14 24h68v14c-9 7-20 3-30-1s-27-6-38 3z" fill="#f6eedb"/><g fill="#7a1f1f"><circle cx="31" cy="24" r="5.2"/><circle cx="48" cy="24" r="5.2"/><circle cx="65" cy="24" r="5.2"/><circle cx="31" cy="57" r="4.6"/><circle cx="48" cy="57" r="4.6"/><circle cx="65" cy="57" r="4.6"/></g></svg>
          <span class="word"><span class="s">STOCK</span><svg viewBox="0 0 58 6" preserveAspectRatio="none"><path d="M0 3c4-3 7 3 11 0s7-3 11 0 7 3 11 0 7-3 11 0 7 3 14 0" fill="none" stroke="#a89a82" stroke-width="1.1" stroke-dasharray="2.4 1.6"/></svg><span class="f">&amp; FOIL</span></span>
        </span>
        <div class="tag">CUT IT · PUNCH IT · PROVE IT</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var min = 1800;
        try {
          var v = new URLSearchParams(location.search).get('splash');
          if (v !== null && /^\d+$/.test(v)) min = Math.min(10000, Number(v));
        } catch (e) {}
        window.__sfSplash = { start: performance.now(), min: min };
        var s0 = document.getElementById('sf-splash');
        if (s0) s0.style.setProperty('--ms', Math.max(200, min) + 'ms');
        setTimeout(function () {
          var s = document.getElementById('sf-splash');
          if (s) { s.remove(); document.body.classList.remove('splashing'); }
        }, Math.max(8000, min + 3000));
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
